services:
  app:
    build: .
    container_name: node_app
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - my_network

  mysql:
    image: mysql:9.5.0
    container_name: mysql_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=123
      - MYSQL_DATABASE=bd_ventas
      
    ports:
      - "3306:3306"   # opcional, si quieres exponerlo fuera
    networks:
      - my_network
    volumes:
      # use a named volume (or a host path) so data persists and is created
      - mysql_data:/var/lib/mysql

networks:
  my_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
